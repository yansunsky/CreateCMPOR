modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

# === 依赖声明 ===
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Create：必需（本模组复用其应力系统与渲染）
[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "[6.0,)"
ordering = "AFTER"
side = "BOTH"

# CompactMachines：必需（提供压缩房间与绑定机器）
[[dependencies.${mod_id}]]
modId = "compactmachines"
type = "required"
versionRange = "[7.0,)"
ordering = "AFTER"
side = "BOTH"

# Mixin 配置（后续阶段注入 CompactMachines 的入口交互）
[[mixins]]
config = "createcmpor.mixins.json"

